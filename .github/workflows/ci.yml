name: Supply Chain Control Tower CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Databricks notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          notebooks = list(pathlib.Path(".").glob("*.ipynb"))

          if not notebooks:
              print("ERROR: No Databricks notebooks found.")
              sys.exit(1)

          failed = False

          for notebook in notebooks:
              try:
                  with open(notebook, "r", encoding="utf-8") as f:
                      json.load(f)
                  print(f"PASS: {notebook}")
              except Exception as e:
                  print(f"FAIL: {notebook} -> {e}")
                  failed = True

          if failed:
              sys.exit(1)

          print(f"Validated {len(notebooks)} notebook(s) successfully.")
          PY

      - name: Check required notebooks
        run: |
          required=(
            "01_Bronze_Data_Quality.ipynb"
            "01_Bronze_Ingestion.ipynb"
            "02_Silver_Transformation.ipynb"
            "03.Gold_KPI_Exceptions.ipynb"
            "05_RBAC_Governance.ipynb"
            "Audit Logging Notebook.ipynb"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
            echo "FOUND: $file"
          done

          echo "All required notebooks are present."
